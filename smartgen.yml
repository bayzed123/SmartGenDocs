site_name: Smartgen Developer Docs
site_url: https://github.com/bayzed123/SmartGenDocs
site_author: Sayad Md Bayezid Hosan & SmartGen Platform
site_description: Skill For Every Devloper Open source project 
repo_name: GitHub
edit_uri: edit/main/docs/

# SmartGen Docs is the documentation engine for this repository.
# Keep provider credentials in Cloudflare bindings or GitHub Actions secrets only.
theme:
  name: apiplay
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono
  favicon: assets/favicon.svg
  logo: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
    - toc.integrate
    - content.code.copy
    - header.autohide
  icon:
    repo: fontawesome/brands/github
  extra_css:
    - stylesheets/extra.css
  extra_javascript:
    - javascripts/docs.js

plugins:
  - search
  - scaffold

