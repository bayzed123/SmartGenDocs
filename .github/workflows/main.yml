name: Build and deploy SmartGen Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'assets/**'
      - 'smartgen.yml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SmartGen Docs
        run: python -m pip install --upgrade pip smartgen-docs

      - name: Build documentation
        run: smartgen-docs build

      - name: Upload generated site for the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: smartgen-site
          path: ./site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download generated site
        uses: actions/download-artifact@v4
        with:
          name: smartgen-site
          path: ./site

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true